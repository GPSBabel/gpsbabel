name: gpsbabel # you probably want to 'snapcraft register <name>'
base: core26 # the base snap is the execution environment for this snap
summary: "Convert, manipulate and transfer GPS data."
description: |
  Convert, manipulate and transfer data from GPS programs or GPS
  recievers.  Open source and supported on macOS, Windows and Linux.

license: GPL-2.0
title: GPSBabel
source-code: https://github.com/GPSBabel/gpsbabel.git
website: https://www.gpsbabel.org

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots

apps:
  gpsbabel:
    extensions: [gnome]
    plugs:
      - home
      - raw-usb
      - removable-media
      - serial-port
    command: usr/bin/gpsbabel
  gpsbabelfe:
#   avoid issues with fonts replaced by empty squares
#   avoid issue: pxbackend-WARNING **: 08:18:06.724: GNOME desktop detected but no schemes installed, aborting.
    extensions: [gnome]
    plugs:
      - desktop
      - desktop-legacy
      - network-status
      - home
      - removable-media
      - network
      - opengl
      - unity7
      - wayland
      - x11
    command-chain:
      - usr/bin/gpsbabelfe.sh
    command: usr/bin/gpsbabelfe
    desktop: usr/share/applications/gpsbabelfe.desktop

plugs:
# avoid FATAL:credentials.cc(122)] Check failed: . : Permission denied (13) with map preview
# requires manual connection
  browser-sandbox: # gpsbabelfe
    interface: browser-support
    allow-sandbox: true

# remap the ubuntu qt6 install directories to the snap.
layout:
  /usr/share/qt6:
    symlink: $SNAP/usr/share/qt6
  /usr/lib/qt6:
    symlink: $SNAP/usr/lib/qt6
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6

adopt-info: gpsbabel
parts:
  gpsbabel:
    # See 'snapcraft plugins'
    plugin: cmake
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DGPSBABEL_WITH_ZLIB=pkgconfig
      - -DGPSBABEL_WITH_SHAPELIB=pkgconfig
    cmake-generator: Ninja
    source: .
    override-pull: |
      craftctl default
      # add install command to CMakeLists.txt
      echo "install(PROGRAMS snap/local/gpsbabelfe.sh TYPE BIN)" >> CMakeLists.txt
      # jam repo sha into GITHUB_SHA
      sed -i.bak -e"/GB.SHA/i set(ENV{GITHUB_SHA} \"$(git log -1 --format=%h)\")" gbversion.cmake
      # set snap version
      # ensure version has at most 32 characters
      craftctl set version="$(git describe | sed -e 's/gpsbabel_//' -e 's/_/./g')"
      # correct icon location
      sed -i.bak -e 's|Icon=.*|Icon=/usr/share/icons/hicolor/256x256/apps/gpsbabelfe.png|' gui/gpsbabelfe.desktop
    build-packages:
      - git
      - vim
      - g++
      - ninja-build
      - zlib1g-dev
      - libshp-dev
      - libusb-1.0-0-dev
      - pkg-config
      - libudev-dev
      - qt6-base-dev
      - qt6-5compat-dev
      - qt6-serialport-dev
      - libx11-xcb-dev
      - libxkbcommon-dev
      - qt6-tools-dev
      - qt6-translations-l10n
      - qt6-webengine-dev
      - qt6-wayland

    stage-packages:
      - zlib1g
      - libshp4
      - libusb-1.0-0
      - libqt6core6
      - libqt6core5compat6
      - libqt6gui6
      - libqt6network6
      - libqt6serialport6
      - libqt6widgets6
      - libqt6xml6
      - libqt6webenginewidgets6
      - libqt6webenginecore6
      - libqt6webenginecore6-bin
      - qt6-translations-l10n
      - qt6-qpa-plugins
      - qt6-wayland

    stage:
      # these are all required by libQt6WebEngineCore.so.6.10.2
      # gnome-core26 may have newer version than ubuntu 26.04
      #
      # #!/bin/bash -e
      #
      # find_snap_lib() {
      #   target=$(find /snap/gnome-core26/current/ -name $1)
      #   echo "$target is resolve be $(readlink -e $target)"
      # }
      #
      # find_link_tgt() {
      #   target=$(ldd /usr/lib/x86_64-linux-gnu/libQt6WebEngineCore.so | grep $1 | cut -d' ' -f3)
      #   echo "$target is resolved by $(readlink -e $target)"
      #   find_snap_lib $(basename $target)
      # }
      #
      # echo checking /usr/lib/x86_64-linux-gnu/libQt6WebEngineCore.so dependencies
      # find_link_tgt libfontconfig.so
      # find_link_tgt libharfbuzz-subset.so
      # find_link_tgt libharfbuzz.so
      # find_link_tgt libpsl.so
      - -usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libfontconfig.so.1.*
      - -usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libharfbuzz-subset.so.0.*
      - -usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libharfbuzz.so.0.*
      - -usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libpsl.so.5.*
      # we don't need lintian files
      - -usr/share/lintian

lint:
  ignore:
    - metadata:
      - contact
      - issues
